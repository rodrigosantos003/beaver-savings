name: Beaver Savings - CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build savings-core
        run: yarn build:core

      - name: Lint Web
        run: yarn lint:web

      - name: Lint API
        run: yarn lint:api

      - name: Test API
        run: yarn workspace api test --runInBand

      - name: Build Web
        run: yarn build:web

      - name: Build API
        run: yarn build:api
