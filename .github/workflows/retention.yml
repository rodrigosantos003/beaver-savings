name: Beaver Savings - Inactive Accounts

# Runs the data-retention job described in the Privacy Policy: warns verified users after
# ~23 months of inactivity and deletes accounts inactive for 24 months (see apps/api/src/retention).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: retention
  cancel-in-progress: false

jobs:
  inactive-accounts:
    name: Process inactive accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call retention endpoint
        env:
          API_URL: ${{ vars.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the API_URL repository variable and the CRON_SECRET repository secret."
            exit 1
          fi

          curl --silent --show-error --fail-with-body \
            --max-time 120 --retry 2 --retry-delay 30 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${API_URL%/}/maintenance/inactive-accounts"
          echo
